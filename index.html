<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annemin Sevmediği Kokular</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #fefcea, #f1da36);
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1 {
      color: #e63946;
      margin-bottom: 20px;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      padding: 10px;
      margin: 8px 0;
      background-color: #f1f1f1;
      border-radius: 8px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Annemin Sevmediği Kokular</h1>
    <ul>
      <li>Soğan</li>
      <li>Sarımsak</li>
      <li>Benzin</li>
      <li>Sigara dumanı</li>
      <li>Ağır parfüm</li>
    </ul>
  </div>
</body>
</html>
